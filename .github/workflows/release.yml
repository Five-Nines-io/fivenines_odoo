name: Release

# One release per module version: a tag v<x.y> (the manifest version) builds
# ONE zip for every Odoo serie, checks that it installs and upgrades on 16.0 to
# 20.0, and attaches it to a GitHub release marked "latest". The app links to
#   https://github.com/Five-Nines-io/fivenines_odoo/releases/latest/download/fivenines_monitoring.zip
# (the asset name never changes; fivenines_monitoring-<x.y>.zip is the same
# file under a versioned name).
#
# workflow_dispatch builds and checks only (no release), from any branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        id: zip
        run: |
          tools/build_zip.sh HEAD dist | tee build.txt
          grep '^version=' build.txt >> "$GITHUB_OUTPUT"
      - name: The tag is the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.zip.outputs.version }}" || {
            echo "tag ${GITHUB_REF_NAME} does not match the manifest version ${{ steps.zip.outputs.version }}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/

  check:
    name: check (Odoo ${{ matrix.odoo }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        odoo: ["16.0", "17.0", "18.0", "19.0", "20.0"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist/
      - name: Pull the official Odoo image
        run: docker pull odoo:${{ matrix.odoo }}
      - name: The zip installs and upgrades
        run: |
          TMPDIR=$RUNNER_TEMP tools/check_release_zip.sh dist/fivenines_monitoring.zip fivenines_zip \
            docker run --rm --network host -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" odoo:${{ matrix.odoo }} --

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist/
      - name: Create the GitHub release (marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "fivenines_monitoring $VERSION" \
            --notes "One zip for Odoo 16.0 to 20.0, checked to install and upgrade on each. Unpack it into an addons directory (see the README). SHA256SUMS lists the checksums." \
            dist/fivenines_monitoring.zip "dist/fivenines_monitoring-$VERSION.zip" dist/SHA256SUMS
